<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Electricity Bill Analyzer - Consolidated Export</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
    --bg-main: #0a0a0c;
    --bg-surface: #121216;
    --bg-surface-elevated: #1a1a22;
    --bg-surface-hover: #22222d;
    --border: #23232e;
    --border-highlight: #343444;
    
    /* Professional Crimson & Red Palette */
    --primary: #dc2626;
    --primary-hover: #b91c1c;
    --primary-light: #ef4444;
    --primary-glow: rgba(220, 38, 38, 0.15);
    
    --success: #10b981;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --text-subtle: #64748b;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

body {
    background-color: var(--bg-main);
    color: var(--text-main);
    line-height: 1.5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

header {
    background: rgba(18, 18, 22, 0.8);
    backdrop-filter: blur(12px);
    color: var(--text-main);
    padding: 16px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
}

.logo {
    display: flex;
    align-items: center;
    font-size: 18px;
    font-weight: 700;
    gap: 10px;
    color: var(--text-main);
    letter-spacing: -0.02em;
}

.logo-icon {
    width: 28px;
    height: 28px;
    background: linear-gradient(135deg, var(--primary), #991b1b);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    box-shadow: 0 0 12px var(--primary-glow);
}

.login-btn {
    background: var(--bg-surface-elevated);
    color: var(--text-main);
    padding: 8px 18px;
    border: 1px solid var(--border-highlight);
    border-radius: 6px;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s ease;
}

.login-btn:hover {
    background: var(--bg-surface-hover);
    border-color: var(--primary);
    color: white;
}

.container {
    width: 92%;
    max-width: 960px;
    margin: 48px auto;
    flex: 1;
}

.card {
    background: var(--bg-surface);
    padding: 40px;
    border-radius: 16px;
    border: 1px solid var(--border);
    box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
}

h1 {
    text-align: center;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.025em;
    margin-bottom: 8px;
    color: var(--text-main);
}

.subtitle {
    text-align: center;
    color: var(--text-muted);
    font-size: 14px;
    margin-bottom: 32px;
}

.upload-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border: 2px dashed var(--border-highlight);
    padding: 44px 20px;
    border-radius: 12px;
    background: rgba(26, 26, 34, 0.4);
    text-align: center;
    cursor: pointer;
    transition: all 0.2s ease;
    width: 100%;
}

.upload-box.dragover {
    background: var(--primary-glow);
    border-color: var(--primary-light);
}

.upload-box:hover {
    background: rgba(220, 38, 38, 0.05);
    border-color: var(--primary);
}

.upload-box input {
    display: none;
}

.icon {
    width: 48px;
    height: 48px;
    background: var(--bg-surface-elevated);
    border: 1px solid var(--border-highlight);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 16px;
    color: var(--primary-light);
}

.upload-box h2 {
    font-size: 16px;
    font-weight: 600;
    color: var(--text-main);
}

.upload-box p {
    font-size: 13px;
    color: var(--text-subtle);
    margin: 4px 0 16px 0;
}

.browse-btn {
    background: var(--bg-surface-elevated);
    color: var(--text-main);
    padding: 8px 18px;
    border: 1px solid var(--border-highlight);
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    transition: all 0.2s;
}

.browse-btn:hover {
    background: var(--border-highlight);
    color: white;
}

.file-queue {
    margin-top: 28px;
    background: var(--bg-main);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px;
}

.file-queue-header {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-muted);
    margin-bottom: 12px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 8px;
}

#fileList {
    max-height: 200px;
    overflow-y: auto;
}

.file-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--bg-surface);
    padding: 10px 14px;
    border-radius: 6px;
    margin-bottom: 8px;
    font-size: 13px;
    border: 1px solid var(--border);
}

.file-item:last-child {
    margin-bottom: 0;
}

.file-name {
    color: var(--text-main);
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 65%;
}

.file-meta {
    display: flex;
    align-items: center;
    gap: 12px;
    color: var(--text-muted);
    font-size: 12px;
}

.remove-file {
    color: var(--text-subtle);
    cursor: pointer;
    font-weight: bold;
    padding: 2px 6px;
    border-radius: 4px;
    transition: all 0.2s;
}

.remove-file:hover {
    color: var(--primary-light);
    background: rgba(239, 68, 68, 0.1);
}

.options {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-top: 32px;
}

.option {
    background: var(--bg-surface-elevated);
    border: 1px solid var(--border);
    padding: 12px 14px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    cursor: pointer;
    transition: border-color 0.2s;
}

.option:hover {
    border-color: var(--border-highlight);
}

.option label {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-main);
}

.option input[type="checkbox"] {
    width: 16px;
    height: 16px;
    accent-color: var(--primary);
    border-radius: 4px;
}

.progress {
    margin-top: 28px;
    height: 6px;
    background: var(--bg-surface-elevated);
    border-radius: 9999px;
    overflow: hidden;
    display: none;
}

.bar {
    width: 0%;
    height: 100%;
    background: linear-gradient(90deg, var(--primary), var(--primary-light));
    transition: width 0.3s ease;
}

.status-label {
    text-align: center;
    font-size: 13px;
    color: var(--text-muted);
    margin-top: 10px;
    display: none;
}

.buttons {
    margin-top: 32px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
}

.buttons button {
    padding: 12px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    transition: all 0.2s ease;
}

.upload { 
    background: var(--primary); 
    color: white; 
}
.upload:hover { 
    background: var(--primary-hover); 
    box-shadow: 0 0 15px var(--primary-glow);
}

.analyze { 
    background: var(--bg-surface-elevated); 
    color: var(--text-main); 
    border: 1px solid var(--border-highlight) !important;
}
.analyze:hover { 
    border-color: var(--primary) !important;
}

.reset { 
    background: transparent; 
    color: var(--text-muted); 
    border: 1px solid var(--border) !important; 
}
.reset:hover { 
    background: var(--bg-surface-hover); 
    color: var(--text-main);
}

.download { 
    background: var(--bg-surface-elevated); 
    color: var(--text-main); 
    border: 1px solid var(--border-highlight) !important;
}
.download:hover { 
    border-color: var(--primary) !important;
}

footer {
    margin-top: auto;
    border-top: 1px solid var(--border);
    background: var(--bg-surface);
    color: var(--text-subtle);
    padding: 20px;
    text-align: center;
    font-size: 13px;
}

@media(max-width: 768px) {
    header { padding: 16px 20px; }
    .container { margin: 24px auto; }
    .card { padding: 24px; }
    .options { grid-template-columns: 1fr; }
    .buttons { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<header>
    <div class="logo">
        <div class="logo-icon">⚡</div>
        <span>AI Bill Analyzer</span>
    </div>
    <button class="login-btn">Login</button>
</header>

<div class="container">
    <div class="card">
        <h1>Batch Bill Processing</h1>
        <p class="subtitle">Upload multiple files to extract and combine all bill data into a single CSV report.</p>

        <label class="upload-box" id="dropArea">
            <div class="icon">
                <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
            </div>
            <h2>Drag & Drop Multiple Bills Here</h2>
            <p>or select files from your computer</p>
            <button type="button" class="browse-btn">Browse Files</button>
            <input type="file" id="fileInput" accept=".pdf,.jpg,.jpeg,.png" multiple>
        </label>

        <div class="file-queue" id="fileQueue">
            <div class="file-queue-header">
                <span>Selected File Queue</span>
                <span id="queueCount">0 files selected</span>
            </div>
            <div id="fileList">
                <p style="text-align: center; color: var(--text-subtle); font-size: 13px; padding: 12px 0;">No files added yet.</p>
            </div>
        </div>

        <div class="options">
            <div class="option"><label><input type="checkbox" checked> OCR Extraction</label></div>
            <div class="option"><label><input type="checkbox" checked> Cost Analysis</label></div>
            <div class="option"><label><input type="checkbox" checked> Energy Usage</label></div>
            <div class="option"><label><input type="checkbox"> Carbon Footprint</label></div>
            <div class="option"><label><input type="checkbox"> AI Recommendations</label></div>
            <div class="option"><label><input type="checkbox"> Historical Comparison</label></div>
        </div>

        <div class="progress" id="progress">
            <div class="bar" id="bar"></div>
        </div>
        <div class="status-label" id="statusLabel">Extracting and merging all files...</div>

        <div class="buttons">
            <button class="upload" onclick="processBatch(event)">Upload All</button>
            <button class="analyze" onclick="processBatch(event)">Analyze All</button>
            <button class="reset" onclick="resetQueue()">Reset</button>
            <button class="download" onclick="processBatch(event)">Download Single CSV</button>
        </div>
    </div>
</div>

<footer>
    AI Electricity Bill Analyzer &copy; 2026
</footer>

<script>
    const BACKEND_URL = "https://stunning-frayed-quiver.ngrok-free.dev"; 

    const fileInput = document.getElementById("fileInput");
    const dropArea = document.getElementById("dropArea");
    const fileListContainer = document.getElementById("fileList");
    const queueCount = document.getElementById("queueCount");

    let selectedFiles = [];

    function updateQueueUI() {
        fileListContainer.innerHTML = "";
        
        if (selectedFiles.length === 0) {
            fileListContainer.innerHTML = `<p style="text-align: center; color: var(--text-subtle); font-size: 13px; padding: 12px 0;">No files added yet.</p>`;
            queueCount.innerText = "0 files selected";
            return;
        }

        queueCount.innerText = `${selectedFiles.length} file(s) selected`;

        selectedFiles.forEach((file, index) => {
            const item = document.createElement("div");
            item.className = "file-item";
            item.innerHTML = `
                <span class="file-name" title="${file.name}">📄 ${file.name}</span>
                <div class="file-meta">
                    <span>${(file.size / 1024).toFixed(1)} KB</span>
                    <span class="remove-file" onclick="removeFile(${index})">✕</span>
                </div>
            `;
            fileListContainer.appendChild(item);
        });
    }

    function addFiles(newFiles) {
        for (let file of newFiles) {
            if (!selectedFiles.some(f => f.name === file.name && f.size === file.size)) {
                selectedFiles.push(file);
            }
        }
        updateQueueUI();
    }

    function removeFile(index) {
        selectedFiles.splice(index, 1);
        updateQueueUI();
    }

    function resetQueue() {
        selectedFiles = [];
        fileInput.value = "";
        updateQueueUI();
        document.getElementById("progress").style.display = "none";
        document.getElementById("statusLabel").style.display = "none";
        document.getElementById("bar").style.width = "0%";
    }

    fileInput.addEventListener("change", function() {
        if (this.files.length) {
            addFiles(this.files);
        }
    });

    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
        dropArea.addEventListener(eventName, (e) => {
            e.preventDefault();
            e.stopPropagation();
        }, false);
    });

    ['dragenter', 'dragover'].forEach(eventName => {
        dropArea.addEventListener(eventName, () => dropArea.classList.add('dragover'), false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
        dropArea.addEventListener(eventName, () => dropArea.classList.remove('dragover'), false);
    });

    dropArea.addEventListener('drop', (e) => {
        const dt = e.dataTransfer;
        if (dt.files.length) {
            addFiles(dt.files);
        }
    });

    const browseBtn = document.querySelector(".browse-btn");
    if (browseBtn) {
        browseBtn.onclick = function(e) {
            e.preventDefault();
            fileInput.click();
        };
    }

    // Single request batch handler
    async function processBatch(e) {
        if (e) e.preventDefault();

        if (selectedFiles.length === 0) {
            alert("Please select at least one bill file to process.");
            return;
        }

        const loaderWrapper = document.getElementById("progress");
        const activeBar = document.getElementById("bar");
        const statusLabel = document.getElementById("statusLabel");

        loaderWrapper.style.display = "block";
        statusLabel.style.display = "block";
        activeBar.style.width = "40%";
        statusLabel.innerText = `Extracting data from ${selectedFiles.length} file(s)...`;

        const formData = new FormData();
        // Append all files under the key "files" expected by FastAPI List[UploadFile]
        selectedFiles.forEach(file => {
            formData.append("files", file);
        });

        try {
            const response = await fetch(`${BACKEND_URL}/extract_bills_batch/`, {
                method: "POST",
                headers: {
                    "ngrok-skip-browser-warning": "true"
                },
                body: formData
            });

            if (!response.ok) {
                const errorText = await response.text();
                throw new Error(`Server error ${response.status}: ${errorText}`);
            }

            activeBar.style.width = "100%";
            statusLabel.innerText = "Processing complete! Downloading merged CSV...";

            const dataBlob = await response.blob();
            const blobUrl = window.URL.createObjectURL(dataBlob);
            
            const downloader = document.createElement("a");
            downloader.href = blobUrl;
            downloader.download = `consolidated_bills_report.csv`;
            document.body.appendChild(downloader);
            downloader.click();
            downloader.remove();

            setTimeout(() => {
                alert(`Successfully processed all ${selectedFiles.length} files into one CSV!`);
            }, 300);

        } catch (err) {
            console.error("Batch error:", err);
            alert(`Error processing files: ${err.message}`);
            activeBar.style.width = "0%";
        }
    }
</script>

</body>
</html>
