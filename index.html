<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Electricity Bill Analyzer - Consolidated Export</title>

<style>
:root {
    --bg-main: #0f172a;        
    --bg-surface: #1e293b;     
    --bg-surface-hover: #273549; 
    --primary: #dc2626;        
    --primary-hover: #b91c1c;  
    --success: #16a34a;
    --text-main: #f8fafc;      
    --text-muted: #94a3b8;     
    --border: #334155;         
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

body {
    background-color: var(--bg-main);
    color: var(--text-main);
    line-height: 1.5;
}

header {
    background: var(--bg-surface);
    color: var(--text-main);
    padding: 16px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
}

.logo {
    display: flex;
    align-items: center;
    font-size: 20px;
    font-weight: 700;
    gap: 8px;
    color: var(--primary);
}

.login-btn {
    background: transparent;
    color: var(--text-main);
    padding: 8px 16px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s;
}

.login-btn:hover {
    background: var(--bg-main);
    border-color: var(--primary);
}

.container {
    width: 92%;
    max-width: 1000px;
    margin: 48px auto;
}

.card {
    background: var(--bg-surface);
    padding: 40px;
    border-radius: 16px;
    border: 1px solid var(--border);
    box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.3);
}

h1 {
    text-align: center;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.025em;
    margin-bottom: 8px;
    color: var(--text-main);
}

.subtitle {
    text-align: center;
    color: var(--text-muted);
    font-size: 15px;
    margin-bottom: 32px;
}

.upload-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border: 2px dashed var(--primary);
    padding: 40px 20px;
    border-radius: 12px;
    background: #2d1a1a;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s ease;
    width: 100%;
}

.upload-box.dragover {
    background: #4a1f1f;
    border-color: #ef4444;
}

.upload-box:hover {
    background: #3f1f1f;
    border-color: var(--primary-hover);
}

.upload-box input {
    display: none;
}

.icon {
    font-size: 48px;
    margin-bottom: 12px;
}

.upload-box h2 {
    font-size: 18px;
    font-weight: 600;
    color: var(--text-main);
}

.upload-box p {
    font-size: 14px;
    color: var(--text-muted);
    margin: 4px 0 12px 0;
}

.browse-btn {
    background: var(--primary);
    color: white;
    padding: 10px 20px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    transition: background 0.2s;
}

.browse-btn:hover {
    background: var(--primary-hover);
}

.file-queue {
    margin-top: 24px;
    background: var(--bg-main);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    max-height: 220px;
    overflow-y: auto;
}

.file-queue-header {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 12px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 6px;
}

.file-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--bg-surface);
    padding: 8px 12px;
    border-radius: 6px;
    margin-bottom: 8px;
    font-size: 13px;
    border: 1px solid var(--border);
}

.file-item:last-child {
    margin-bottom: 0;
}

.file-name {
    color: var(--text-main);
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 60%;
}

.file-meta {
    display: flex;
    align-items: center;
    gap: 12px;
    color: var(--text-muted);
}

.remove-file {
    color: #ef4444;
    cursor: pointer;
    font-weight: bold;
    padding: 2px 6px;
    border-radius: 4px;
}

.remove-file:hover {
    background: rgba(239, 68, 68, 0.2);
}

.options {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-top: 32px;
}

.option {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    padding: 14px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    cursor: pointer;
    transition: background 0.2s;
}

.option:hover {
    background: var(--bg-surface-hover);
    border-color: var(--primary);
}

.option label {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
}

.option input[type="checkbox"] {
    width: 16px;
    height: 16px;
    accent-color: var(--primary);
}

.progress {
    margin-top: 24px;
    height: 10px;
    background: var(--border);
    border-radius: 9999px;
    overflow: hidden;
    display: none;
}

.bar {
    width: 0%;
    height: 100%;
    background: var(--primary);
    transition: width 0.3s ease;
}

.status-label {
    text-align: center;
    font-size: 13px;
    color: var(--text-muted);
    margin-top: 8px;
    display: none;
}

.buttons {
    margin-top: 32px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
}

.buttons button {
    padding: 12px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    transition: all 0.2s;
}

.upload { background: var(--primary); color: white; }
.upload:hover { background: var(--primary-hover); }

.analyze { background: var(--success); color: white; }
.analyze:hover { background: #15803d; }

.reset { background: transparent; color: var(--text-main); border: 1px solid var(--border) !important; }
.reset:hover { background: var(--bg-surface-hover); }

.download { background: #581c87; color: white; }
.download:hover { background: #4c1d95; }

footer {
    margin-top: 80px;
    border-top: 1px solid var(--border);
    background: var(--bg-surface);
    color: var(--text-muted);
    padding: 24px;
    text-align: center;
    font-size: 14px;
}

@media(max-width: 768px) {
    header { padding: 16px 20px; }
    .container { margin: 24px auto; }
    .card { padding: 24px; }
    .options { grid-template-columns: 1fr; }
    .buttons { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<header>
    <div class="logo">⚡ AI Bill Analyzer</div>
    <button class="login-btn">Login</button>
</header>

<div class="container">
    <div class="card">
        <h1>Batch Bill Processing</h1>
        <p class="subtitle">Upload multiple files to extract and combine all bill data into a single CSV report.</p>

        <label class="upload-box" id="dropArea">
            <div class="icon">📁</div>
            <h2>Drag & Drop Multiple Bills Here</h2>
            <p>or</p>
            <button type="button" class="browse-btn">Browse Files</button>
            <input type="file" id="fileInput" accept=".pdf,.jpg,.jpeg,.png" multiple>
        </label>

        <div class="file-queue" id="fileQueue">
            <div class="file-queue-header">
                <span>Selected File Queue</span>
                <span id="queueCount">0 files selected</span>
            </div>
            <div id="fileList">
                <p style="text-align: center; color: var(--text-muted); font-size: 13px; margin-top: 12px;">No files added yet.</p>
            </div>
        </div>

        <div class="options">
            <div class="option"><label><input type="checkbox" checked> OCR Extraction</label></div>
            <div class="option"><label><input type="checkbox" checked> Cost Analysis</label></div>
            <div class="option"><label><input type="checkbox" checked> Energy Usage</label></div>
            <div class="option"><label><input type="checkbox"> Carbon Footprint</label></div>
            <div class="option"><label><input type="checkbox"> AI Recommendations</label></div>
            <div class="option"><label><input type="checkbox"> Historical Comparison</label></div>
        </div>

        <div class="progress" id="progress">
            <div class="bar" id="bar"></div>
        </div>
        <div class="status-label" id="statusLabel">Extracting and merging all files...</div>

        <div class="buttons">
            <button class="upload" onclick="processBatch(event)">Upload All</button>
            <button class="analyze" onclick="processBatch(event)">Analyze All</button>
            <button class="reset" onclick="resetQueue()">Reset</button>
            <button class="download" onclick="processBatch(event)">Download Single CSV</button>
        </div>
    </div>
</div>

<footer>
    AI Electricity Bill Analyzer &copy; 2026
</footer>

<script>
    const BACKEND_URL = "https://stunning-frayed-quiver.ngrok-free.dev"; 

    const fileInput = document.getElementById("fileInput");
    const dropArea = document.getElementById("dropArea");
    const fileListContainer = document.getElementById("fileList");
    const queueCount = document.getElementById("queueCount");

    let selectedFiles = [];

    function updateQueueUI() {
        fileListContainer.innerHTML = "";
        
        if (selectedFiles.length === 0) {
            fileListContainer.innerHTML = `<p style="text-align: center; color: var(--text-muted); font-size: 13px; margin-top: 12px;">No files added yet.</p>`;
            queueCount.innerText = "0 files selected";
            return;
        }

        queueCount.innerText = `${selectedFiles.length} file(s) selected`;

        selectedFiles.forEach((file, index) => {
            const item = document.createElement("div");
            item.className = "file-item";
            item.innerHTML = `
                <span class="file-name" title="${file.name}">📄 ${file.name}</span>
                <div class="file-meta">
                    <span>${(file.size / 1024).toFixed(1)} KB</span>
                    <span class="remove-file" onclick="removeFile(${index})">✕</span>
                </div>
            `;
            fileListContainer.appendChild(item);
        });
    }

    function addFiles(newFiles) {
        for (let file of newFiles) {
            if (!selectedFiles.some(f => f.name === file.name && f.size === file.size)) {
                selectedFiles.push(file);
            }
        }
        updateQueueUI();
    }

    function removeFile(index) {
        selectedFiles.splice(index, 1);
        updateQueueUI();
    }

    function resetQueue() {
        selectedFiles = [];
        fileInput.value = "";
        updateQueueUI();
        document.getElementById("progress").style.display = "none";
        document.getElementById("statusLabel").style.display = "none";
        document.getElementById("bar").style.width = "0%";
    }

    fileInput.addEventListener("change", function() {
        if (this.files.length) {
            addFiles(this.files);
        }
    });

    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
        dropArea.addEventListener(eventName, (e) => {
            e.preventDefault();
            e.stopPropagation();
        }, false);
    });

    ['dragenter', 'dragover'].forEach(eventName => {
        dropArea.addEventListener(eventName, () => dropArea.classList.add('dragover'), false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
        dropArea.addEventListener(eventName, () => dropArea.classList.remove('dragover'), false);
    });

    dropArea.addEventListener('drop', (e) => {
        const dt = e.dataTransfer;
        if (dt.files.length) {
            addFiles(dt.files);
        }
    });

    const browseBtn = document.querySelector(".browse-btn");
    if (browseBtn) {
        browseBtn.onclick = function(e) {
            e.preventDefault();
            fileInput.click();
        };
    }

    // Single request batch handler
    async function processBatch(e) {
        if (e) e.preventDefault();

        if (selectedFiles.length === 0) {
            alert("Please select at least one bill file to process.");
            return;
        }

        const loaderWrapper = document.getElementById("progress");
        const activeBar = document.getElementById("bar");
        const statusLabel = document.getElementById("statusLabel");

        loaderWrapper.style.display = "block";
        statusLabel.style.display = "block";
        activeBar.style.width = "40%";
        statusLabel.innerText = `Extracting data from ${selectedFiles.length} file(s)...`;

        const formData = new FormData();
        // Append all files under the key "files" expected by FastAPI List[UploadFile]
        selectedFiles.forEach(file => {
            formData.append("files", file);
        });

        try {
            const response = await fetch(`${BACKEND_URL}/extract_bills_batch/`, {
                method: "POST",
                headers: {
                    "ngrok-skip-browser-warning": "true"
                },
                body: formData
            });

            if (!response.ok) {
                const errorText = await response.text();
                throw new Error(`Server error ${response.status}: ${errorText}`);
            }

            activeBar.style.width = "100%";
            statusLabel.innerText = "Processing complete! Downloading merged CSV...";

            const dataBlob = await response.blob();
            const blobUrl = window.URL.createObjectURL(dataBlob);
            
            const downloader = document.createElement("a");
            downloader.href = blobUrl;
            downloader.download = `consolidated_bills_report.csv`;
            document.body.appendChild(downloader);
            downloader.click();
            downloader.remove();

            setTimeout(() => {
                alert(`Successfully processed all ${selectedFiles.length} files into one CSV!`);
            }, 300);

        } catch (err) {
            console.error("Batch error:", err);
            alert(`Error processing files: ${err.message}`);
            activeBar.style.width = "0%";
        }
    }
</script>

</body>
</html>
